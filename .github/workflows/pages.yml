name: Deploy signal pages

on:
  push:
    branches: [main]
  # The nightly run is triggered externally (cron-job.org POSTs a
  # workflow_dispatch at 00:17 New York time, Tue-Sat), because GitHub's own
  # scheduler has been starting runs 5-7 h late. 00:17 is after Yahoo's evening
  # window in which the newest bar's close comes back blank.
  workflow_dispatch:
  schedule:
    # Backup only, in case the external trigger fails: same time, but GitHub
    # may start it hours late. Runs are idempotent, so a second run is a no-op.
    - cron: "17 0 * * 2-6"
      timezone: "America/New_York"

permissions:
  contents: write   # to commit the appended signal log back to the repo
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Log today's signal
        run: uv run python scripts/log_signal.py data/signals.csv TQQQ SPXL

      - name: Build signal pages
        run: uv run python scripts/build_site.py site TQQQ SPXL

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # Persist the log/fills last and best-effort, so a git hiccup can never
      # block the build or deploy. fills.csv only exists once a round-trip has
      # completed, so each file is staged only when present.
      - name: Commit the signal log and fills ledger
        if: always()
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f data/signals.csv ]; then git add data/signals.csv; fi
          if [ -f data/fills.csv ]; then git add data/fills.csv; fi
          if git diff --cached --quiet; then
            echo "Nothing new to log."
          else
            git commit -m "chore: log daily signal + fills [skip ci]"
            git push
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
